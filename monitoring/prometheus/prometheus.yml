global:
  scrape_interval: 15s

scrape_configs:
  - job_name: auth-service
    static_configs:
      - targets: ['auth-service:3001']
  - job_name: register-service
    static_configs:
      - targets: ['register-service:3002']
  - job_name: target-service
    static_configs:
      - targets: ['target-service:3003']
  - job_name: mail-service
    static_configs:
      - targets: ['mail-service:3004']
  - job_name: clock-service
    static_configs:
      - targets: ['clock-service:3005']
  - job_name: score-service
    static_configs:
      - targets: ['score-service:3006']
  - job_name: read-service
    static_configs:
      - targets: ['read-service:3007']
  - job_name: swagger-service
    static_configs:
      - targets: ['swagger-service:3008']
