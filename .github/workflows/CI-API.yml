name: API & Week1 CI Pipeline

on:
  push:
    paths:
      - 'api/**'
      - 'week1/**'
  pull_request:
    branches:
      - main
    paths:
      - 'api/**'
      - 'week1/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        folder: [api, week1]
    
    defaults:
      run:
        working-directory: ${{ matrix.folder }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js for ${{ matrix.folder }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '${{ matrix.folder }}/package-lock.json'

      - name: Install dependencies for ${{ matrix.folder }}
        run: npm ci

      - name: Run ESLint for ${{ matrix.folder }}
        run: eslint --config ./eslint.config.mjs .
        continue-on-error: true
        
      - name: Run tests with coverage for ${{ matrix.folder }}
        run: npm run test:coverage -- --coverageThreshold='{"global":{"branches":80,"functions":80,"lines":80,"statements":80}}'
        
      - name: Run basic tests for ${{ matrix.folder }}
        working-directory: ${{ matrix.folder }}
        run: jest
